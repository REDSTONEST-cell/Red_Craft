[package]
name = "red-craft"
description = "Red Craft — Minecraft Java 版启动器"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "red_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 便携版单文件 exe：数据始终保存在 exe 所在目录（类似 PCL）
portable = []

[dependencies]
launcher-core.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
dirs = "6"
reqwest.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "v5"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
