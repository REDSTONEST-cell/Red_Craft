[workspace]
resolver = "2"
members = ["crates/launcher-core", "src-tauri"]

[workspace.package]
version = "1.1.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/REDSTONEST-cell/Red_Craft"

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
# 整体按体积优化，热点路径上的库（哈希、解压、JSON、下载）单独按速度优化
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.launcher-core]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3

# 开发时依赖保持较快的编译速度，但让下载/解压相关的依赖跑得快一些
[profile.dev.package."*"]
opt-level = 2
