name: 构建

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本号（例如 v0.1.0），留空则只构建不发布"
        required: false
        default: ""

env:
  # 微软登录使用的 Azure 应用 Client ID（公开信息，不是密钥）
  REDCRAFT_MS_CLIENT_ID: 3b8bb0ce-d514-42fe-83b6-bb374eb8b665

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: 打包 (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: app,dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: RedCraft-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist-release
          merge-multiple: true
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # 产物按 bundle/<类型>/ 分目录保存，这里收集所有文件
          mapfile -t files < <(find dist-release -type f)
          printf '%s\n' "${files[@]}"
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          # 0.x 版本标记为预发布
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Red Craft ${TAG}" --notes-file "$notes" $pre
